<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Fabric Editor</title>
    <!-- Load Fabric.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background-color: #f0f2f6;">
    <div id="canvas-container"
        style="display: flex; justify-content: center; align-items: start; height: 100vh; overflow: hidden; padding-top: 20px;">
        <canvas id="c"></canvas>
    </div>

    <script>
        // --- Streamlit Integration Helper ---
        // Basic polyfill if needed, but we rely on Streamlit serving the component lib wrapper usually.
        // For custom components, we simply use postMessage to talk to Streamlit host.

        function sendMessageToStreamlit(type, data) {
            // Streamlit Component Protocol
            // We use the `streamlit:setComponentValue` message
            if (type === "setComponentValue") {
                window.parent.postMessage({
                    type: "streamlit:setComponentValue",
                    value: data
                }, "*");
            } else if (type === "componentReady") {
                // Not strictly standard but good practice or mapped by library
            }
        }

        // We wrap interactions to ensure we find the right Streamlit host logic
        // Actually, the easiest way without bundling `streamlit-component-lib.js` is to use the standard handshake.
        // Let's implement a minimal version of the handshake if I can't load the lib globally.
        // Actually, let's try to assume standard usage.

        // BETTER: Use a CDN for streamlit-component-lib if available? No, usually npm installed.
        // I will write a minimal handshake here.

        const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
        const RENDER = "streamlit:render";
        const COMPONENT_READY = "streamlit:componentReady";

        let lastSentValue = null;
        let lastHeight = 0;

        function sendValue(value) {
            const strVal = JSON.stringify(value);
            if (strVal === lastSentValue) return; // Dedup
            lastSentValue = strVal;

            window.parent.postMessage({
                isStreamlitMessage: true,
                type: SET_COMPONENT_VALUE,
                value: value
            }, "*");
        }

        const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";

        function sendHeight(height) {
            if (Math.abs(height - lastHeight) < 2) return; // Dedup with tolerance
            lastHeight = height;

            window.parent.postMessage({
                isStreamlitMessage: true,
                type: SET_FRAME_HEIGHT,
                height: height
            }, "*");
        }

        function notifyReady() {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: COMPONENT_READY,
                apiVersion: 1
            }, "*");
        }

        // --- FABRIC LOGIC ---
        let canvas = new fabric.Canvas('c', {
            preserveObjectStacking: true // CRITICAL: Stop selected objects from jumping to top
        });
        let currentLayers = []; // Cache to avoid infinite re-renders if no change

        // Auto-Resize Canvas on Render
        // Auto-Resize Canvas on Render
        function updateCanvasSize(width, height) {
            // Get Container Width (Available Space)
            // We use document.body.clientWidth because the iframe width is controlled by Streamlit
            const availableWidth = document.body.clientWidth;
            const availableHeight = window.innerHeight; // Optional constraint

            // Calculate Scale Ratio to Fit
            // We want to fit 'width' (1080) into 'availableWidth'
            // Add some padding (20px)
            const ratio = Math.min(
                (availableWidth - 20) / width,
                1 // Don't scale UP, only down? Or allow up? Usually 1 max for crispness unless Retina.
            );

            // Apply Scaling
            // METHOD: Zoom + Dimensions
            // This changes the CSS size of the canvas element while keeping the internal 1080x1080 coordinate system.
            // This is the correct way to handle "Responsive Fabric".

            canvas.setDimensions({
                width: width * ratio,
                height: height * ratio
            });

            canvas.setZoom(ratio);

            // Notify Streamlit Frame Height
            // Request enough height for the scaled canvas + padding
            sendHeight((height * ratio) + 50);
        }

        // Flag to prevent infinite loops during RENDER phase
        let isProgrammaticUpdate = false;

        // --- STATE SYNC ---
        // Send state back to Python on change
        let pendingSnapshotId = null;

        function syncState() {
            if (isProgrammaticUpdate) return;

            const json = canvas.toJSON(['id', 'myType', 'lockMovementX', 'lockMovementY', 'selectable']);
            // ... (Mapping logic)
            // MAPPER: Fabric -> Logic
            const mappedLayers = json.objects.map(obj => {
                let simpleObj = {
                    id: obj.id,
                    left: obj.left,
                    top: obj.top,
                    angle: obj.angle,
                    scaleX: obj.scaleX,
                    scaleY: obj.scaleY,
                    opacity: obj.opacity,
                    width: obj.width * obj.scaleX, // effective dim
                    height: obj.height * obj.scaleY
                };

                if (obj.type === 'i-text' || obj.type === 'text' || obj.type === 'textbox') {
                    simpleObj.type = 'text';
                    simpleObj.content = obj.text;
                    simpleObj.color = obj.fill;
                    simpleObj.text_bg = obj.textBackgroundColor; // Sync back
                    simpleObj.fontSize = obj.fontSize;
                    simpleObj.fontFamily = obj.fontFamily;
                    simpleObj.box_width = obj.width; // Send back wrapped width
                    simpleObj.align = obj.textAlign;
                    simpleObj.bold = (obj.fontWeight === 'bold');
                    simpleObj.italic = (obj.fontStyle === 'italic');

                    // Sync Effects
                    if (obj.shadow) {
                        simpleObj.shadow_color = obj.shadow.color;
                        simpleObj.shadow_blur = obj.shadow.blur;
                        simpleObj.shadow_offset_x = obj.shadow.offsetX;
                        simpleObj.shadow_offset_y = obj.shadow.offsetY;
                    }
                    simpleObj.stroke_color = obj.stroke;
                    simpleObj.stroke_width = obj.strokeWidth;

                } else if (obj.type === 'image') {
                    simpleObj.type = 'image';
                    // We don't send back Base64 content usually due to size, 
                    // we keep the reference 'id' to look up original path in Python?
                    // OR we assume src is preserved. Fabric JSON preserves src.
                    simpleObj.content = obj.src; // This might be a blob or dataURL
                } else if (obj.type === 'rect') {
                    simpleObj.type = 'shape';
                    simpleObj.shape_type = 'rectangle';
                    simpleObj.color = obj.fill;
                    simpleObj.width = obj.width * obj.scaleX;
                    simpleObj.height = obj.height * obj.scaleY;
                    simpleObj.rx = obj.rx;
                } else if (obj.type === 'circle') {
                    simpleObj.type = 'shape';
                    simpleObj.shape_type = 'circle';
                    simpleObj.color = obj.fill;
                    simpleObj.width = obj.radius * 2 * obj.scaleX;
                    simpleObj.height = obj.radius * 2 * obj.scaleY;
                }

                return simpleObj;
            });

            // sendValue now handles dedup logic
            // Format: List (Legacy) OR Dict (New)

            let payload = mappedLayers;
            if (pendingSnapshotId) {
                // Generate Snapshot
                const dataURL = canvas.toDataURL({
                    format: 'png',
                    quality: 1.0,
                    multiplier: 2 // High Res
                });

                payload = {
                    layers: mappedLayers,
                    snapshot: dataURL,
                    save_id: pendingSnapshotId
                };

                // Clear ID after sending ONE snapshot
                pendingSnapshotId = null;
            }

            sendValue(payload);
        }

        let isUserInteracting = false;
        canvas.on('mouse:down', () => { isUserInteracting = true; });
        canvas.on('mouse:up', () => { isUserInteracting = false; });

        canvas.on('object:modified', syncState);
        // canvas.on('object:added', syncState); // DISABLED: Prevents race condition with async loading
        canvas.on('object:removed', syncState);

        // --- RECEIVE FROM PYTHON ---
        window.addEventListener('message', function (event) {
            const data = event.data;
            if (data.type === RENDER) {
                if (isUserInteracting) {
                    console.warn("Skipping RENDER: User is interacting");
                    return;
                }
                const args = data.args;

                isProgrammaticUpdate = true; // LOCK EVENTS

                // Snapshot Request Check
                if (args.save_request_id && args.save_request_id !== "None") {
                    console.log("Snapshot Requested: " + args.save_request_id);
                    pendingSnapshotId = args.save_request_id;
                    // We must force a sync even if layers didn't change, to send the image
                    // We'll do this AFTER rendering is done.
                }

                // 1. Setup Canvas Dimensions
                updateCanvasSize(args.canvas_width, args.canvas_height);

                // 2. Background
                canvas.backgroundColor = args.background_color;
                if (args.background_image) {
                    fabric.Image.fromURL(args.background_image, function (img) {
                        img.set({ originX: 'left', originY: 'top' });
                        // Scale Background to Logical Width/Height
                        // Background image must cover the LOGICAL 1080x1080 area.
                        // Fabric handles zoom automatically for drawing.
                        img.scaleToWidth(1080); // Logical Width

                        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
                    });
                }

                // 3. Render Objects
                canvas.clear();
                canvas.backgroundColor = args.background_color;

                args.layers.forEach((l, index) => {
                    if (l.type === 'text') {
                        // Textbox with Effects
                        let t = new fabric.Textbox(l.content, {
                            id: l.id,
                            left: l.x,
                            top: l.y,
                            fontSize: l.size || 60,
                            fill: l.color,
                            textBackgroundColor: l.text_bg, // Apply
                            fontFamily: l.font || 'Arial',
                            width: l.box_width || 400,
                            splitByGrapheme: true,
                            textAlign: l.align || 'left',
                            fontStyle: l.italic ? 'italic' : 'normal',
                            fontWeight: l.bold ? 'bold' : 'normal',
                            // Effects
                            shadow: l.shadow_color ? new fabric.Shadow({
                                color: l.shadow_color,
                                blur: l.shadow_blur || 0,
                                offsetX: l.shadow_offset_x || 0,
                                offsetY: l.shadow_offset_y || 0
                            }) : null,
                            stroke: l.stroke_color || null,
                            strokeWidth: l.stroke_width || 0
                        });
                        canvas.insertAt(t, index, true);

                    } else if (l.type === 'image') {
                        fabric.Image.fromURL(l.content, function (oImg) {
                            oImg.set({
                                id: l.id,
                                left: l.x,
                                top: l.y,
                                opacity: l.opacity,
                                shadow: l.shadow_color ? new fabric.Shadow({
                                    color: l.shadow_color,
                                    blur: l.shadow_blur || 0,
                                    offsetX: l.shadow_offset_x || 0,
                                    offsetY: l.shadow_offset_y || 0
                                }) : null
                            });
                            if (l.width) oImg.scaleToWidth(l.width);
                            canvas.insertAt(oImg, index, true);
                        });

                    } else if (l.type === 'shape') {
                        let shape_obj;
                        if (l.shape_type === 'rectangle') {
                            shape_obj = new fabric.Rect({
                                id: l.id,
                                left: l.x,
                                top: l.y,
                                fill: l.color,
                                width: l.width,
                                height: l.height,
                                opacity: l.opacity,
                                rx: l.border_radius || 0,
                                ry: l.border_radius || 0
                            });
                        } else if (l.shape_type === 'circle') {
                            shape_obj = new fabric.Circle({
                                id: l.id,
                                left: l.x,
                                top: l.y,
                                fill: l.color,
                                radius: l.width / 2,
                                opacity: l.opacity
                            });
                        }
                        if (shape_obj) canvas.insertAt(shape_obj, index, true);
                    }
                });

                // Unlock after a short delay to allow async images to load?
                // Fabric images load async, so canvas.add might happen later for images?
                // Yes, `fabric.Image.fromURL` is async.
                // We need to handle that.
                // For now, let's keep it simple: the `object:added` listener is effectively ignored mostly.
                // BUT `fromURL` will fire `object:added` later when `isProgrammaticUpdate` might be false if we clear it too soon.
                // Actually `fromURL` callback adds it. 
                // We should keep the lock until all images are loaded?
                // Hack: Set isProgrammaticUpdate = false inside the component logically?
                // Or just don't listen to `object:added`? 
                // `object:added` is needed for "New Text" added via Python? 
                // No, if added via Python, it comes via RENDER loop.
                // We only need `object:added` if the USER adds something via JS UI (which we don't have yet).
                // SO WE CAN REMOVE `object:added` LISTENER!
                // Wait, if we implement "Draw Mode" or "Clone" in JS later, we need it.
                // For now, purely Python driven content -> Remove `object:added` listener or Keep Lock.

                // Let's rely on timeouts for now or just Remove `object:added` since we don't have JS tools yet.
                // Removing `object:added` is the SAFEST fix for the infinite loop right now.

                isProgrammaticUpdate = false;

                // If snapshot pending, trigger sync NOW
                if (pendingSnapshotId) {
                    syncState();
                }
            }
        });

        // Init
        notifyReady();

    </script>
</body>

</html>
